<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#06120E"/><stop offset="0.6" stop-color="#0F2C24"/><stop offset="1" stop-color="#0A1E18"/>
 </linearGradient>
 <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#10B981" stop-opacity="0.32"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/>
 </radialGradient>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" fill-opacity="0.22"/>
 </pattern>
 <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.4" fill="#10B981" fill-opacity="0.10"/>
 </pattern>
</defs>
<!-- Shared chaosbit social-preview frame (1280x640). Keep everything that matters inside GitHub's safe zone,
     x 80..1200 and y 80..560 (its repo-card template asks for a 40pt border): unfurlers crop the edges. Only the title, tagline, prompt and icon change per repo. -->
<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#dots)"/>
<circle cx="972" cy="320" r="300" fill="url(#glow)"/>

<!-- terminal window -->
<g transform="translate(8 0)">
<rect x="72" y="104" width="680" height="432" rx="18" fill="#030A08" fill-opacity="0.78" stroke="#10B981" stroke-opacity="0.45" stroke-width="2"/>
<path d="M72 122 a18 18 0 0 1 18 -18 h644 a18 18 0 0 1 18 18 v28 h-680z" fill="#0F2C24"/>
<circle cx="102" cy="127" r="7" fill="#F43F5E" fill-opacity="0.85"/><circle cx="126" cy="127" r="7" fill="#FACC15" fill-opacity="0.85"/><circle cx="150" cy="127" r="7" fill="#10B981"/>
<text x="412" y="133" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#C9DCE6" fill-opacity="0.75">chaosbit-dev/brand</text>

<g font-family="Menlo, monospace">
 <text x="104" y="214" font-size="22" fill="#10B981">~/brand <tspan fill="#C9DCE6">$</tspan> <tspan fill="#E8F4F8">python3 scripts/render.py --social</tspan></text>
 <text x="104" y="300" font-size="64" font-weight="700" fill="#E8F4F8">brand</text>
 <text x="104" y="352" font-size="23" fill="#C9DCE6">Logos, App avatars and these previews,</text>
 <text x="104" y="386" font-size="23" fill="#C9DCE6">as SVG source with one render script.</text>
 <text x="104" y="470" font-size="19" fill="#10B981">[ SVG ]  [ Python ]  [ assets ]</text>
 <rect x="104" y="492" width="14" height="24" fill="#10B981"/>
</g>
</g>
<rect width="1280" height="640" fill="url(#scan)"/>

<!-- footer -->
<text x="1196" y="552" text-anchor="end" font-family="Menlo, monospace" font-size="22" fill="#C9DCE6" fill-opacity="0.8">chaosbit<tspan fill="#10B981">.dev</tspan></text>

<!-- icon ring: draw the repo's icon inside r~150 around (972,320) -->
<circle cx="972" cy="320" r="178" fill="#030A08" fill-opacity="0.55" stroke="#10B981" stroke-width="4"/>
<circle cx="972" cy="320" r="196" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 10"/>
<g transform="translate(972 320)">
 <g stroke="#06120E" stroke-width="4">
  <circle cx="-78" cy="-78" r="30" fill="#10B981"/><circle cx="-8" cy="-112" r="30" fill="#FACC15"/>
  <circle cx="-108" cy="-6" r="30" fill="#38BDF8"/><circle cx="-90" cy="68" r="30" fill="#F43F5E"/>
 </g>
 <g transform="translate(-10 14) rotate(40 40 20)">
  <path d="M10 -120 h60 v120 l-30 70 l-30 -70z" fill="#E8F4F8" stroke="#10B981" stroke-width="6" stroke-linejoin="round"/>
  <path d="M10 -120 h60 v-26 a8 8 0 0 0 -8 -8 h-44 a8 8 0 0 0 -8 8z" fill="#10B981"/>
  <path d="M40 0 v52" stroke="#123A2F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="0" r="11" fill="#123A2F"/>
 </g>
 <path d="M-40 132 C0 96 50 150 104 112" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
</g>
</svg>
